<!DOCTYPE html>
<html lang="es">
<head>

    <title>Bienvenido</title>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: black
        }

        .contenedor {

<body>
    <div class="contenedor">
        <h1>¡Bienvenido!</h1>

</html>
